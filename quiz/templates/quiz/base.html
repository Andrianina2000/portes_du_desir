<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Intimement Nous — Test de connexion intime{% endblock %}</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@200;300;400;500&family=Dancing+Script:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige:      #C5B8A3;
            --sable:      #EDDDAA;
            --rose:       #DE8284;
            --bordeaux:   #8C1827;
            --creme:      #F7F0E8;
            --blanc-doux: #FDF8F3;
            --brun-doux:  #6B5B4E;
            --brun-leger: #A0907F;
            --fond:       #1A0F0D;
            --fond-card:  rgba(42,22,18,0.65);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            background: var(--fond);
            color: var(--creme);
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 90% 70% at 15% 5%,  rgba(140,24,39,0.22)  0%, transparent 55%),
                radial-gradient(ellipse 70% 90% at 85% 95%, rgba(197,184,163,0.12) 0%, transparent 55%),
                radial-gradient(ellipse 30% 40% at 80% 20%, rgba(222,130,132,0.08) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0; opacity: 0.4;
        }
        .page-wrapper {
            position: relative; z-index: 1;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 48px 20px 72px;
        }
        /* ── Header avec vrai logo ── */
        .site-header {
            width: 100%; max-width: 800px;
            text-align: center;
            margin-bottom: 56px;
            padding-bottom: 36px;
            border-bottom: 1px solid rgba(197,184,163,0.15);
            animation: fadeDown 1s cubic-bezier(0.16,1,0.3,1) both;
        }
        .site-logo {
            display: inline-block;
            text-decoration: none;
        }
        .site-logo img {
            height: 250px;
            width: auto;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .site-logo:hover img { opacity: 1; }
        .site-tagline {
            font-size: 0.67rem;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: var(--brun-leger);
            margin-top: 10px;
            font-weight: 300;
            display: block;
        }
        .logo-ornement {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-top: 16px;
        }
        .logo-ornement-line { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(197,184,163,0.3)); }
        .logo-ornement-line.right { background: linear-gradient(90deg, rgba(197,184,163,0.3), transparent); }
        .logo-ornement-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--rose); opacity: 0.6; }

        .container { width: 100%; max-width: 820px; animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.15s both; }

        .card {
            background: var(--fond-card);
            border: 1px solid rgba(197,184,163,0.14);
            border-radius: 3px; padding: 56px;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--rose), var(--sable), transparent);
            opacity: 0.4;
        }

        h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.2rem,6vw,3.4rem); font-weight: 300; line-height: 1.12; color: var(--blanc-doux); margin-bottom: 20px; }
        h1 em { font-style: italic; color: var(--sable); }
        h2 { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.6rem,3.5vw,2.2rem); font-weight: 400; color: var(--sable); margin-bottom: 14px; }
        h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 400; color: var(--blanc-doux); margin-bottom: 10px; }
        p { line-height: 1.9; color: var(--beige); font-size: 1.08rem; }

        .btn { display: inline-flex; align-items: center; gap: 12px; padding: 17px 40px; font-family: 'Jost', sans-serif; font-size: 0.86rem; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; border: none; cursor: pointer; transition: all 0.45s cubic-bezier(0.16,1,0.3,1); border-radius: 1px; position: relative; overflow: hidden; }
        .btn-primary { background: linear-gradient(135deg,var(--bordeaux),#b02035); color: var(--creme); box-shadow: 0 4px 20px rgba(140,24,39,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 35px rgba(140,24,39,0.45); }
        .btn-outline { background: transparent; color: var(--beige); border: 1px solid rgba(197,184,163,0.35); }
        .btn-outline:hover { background: rgba(197,184,163,0.07); border-color: var(--beige); transform: translateY(-1px); }
        .btn-ghost { background: rgba(255,255,255,0.04); color: var(--brun-leger); border: 1px solid rgba(197,184,163,0.12); font-size: 0.72rem; }
        .btn-ghost:hover { background: rgba(197,184,163,0.08); color: var(--beige); }
        .btn-rose { background: linear-gradient(135deg,var(--rose),#c96870); color: #fff; box-shadow: 0 4px 20px rgba(222,130,132,0.25); }
        .btn-rose:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(222,130,132,0.35); }

        .form-group { margin-bottom: 28px; }
        .form-label { display: block; font-size: 0.82rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--brun-leger); margin-bottom: 12px; font-weight: 400; }
        .form-control { width: 100%; padding: 18px 22px; background: rgba(15,8,6,0.5); border: 1px solid rgba(197,184,163,0.18); color: var(--blanc-doux); font-family: 'Jost', sans-serif; font-size: 1.08rem; font-weight: 400; transition: border-color 0.35s, box-shadow 0.35s; outline: none; border-radius: 2px; }
        .form-control:focus { border-color: rgba(222,130,132,0.5); box-shadow: 0 0 0 3px rgba(222,130,132,0.08); }
        .form-control::placeholder { color: rgba(107,91,78,0.5); }
        textarea.form-control { resize: vertical; min-height: 130px; }

        .consent-label { display: flex; align-items: flex-start; gap: 16px; cursor: pointer; padding: 20px; border: 1px solid rgba(197,184,163,0.12); background: rgba(15,8,6,0.3); transition: border-color 0.35s; border-radius: 2px; }
        .consent-label:hover { border-color: rgba(222,130,132,0.25); }
        .consent-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--rose); flex-shrink: 0; margin-top: 2px; cursor: pointer; }
        .consent-text { font-size: 1rem; color: var(--brun-leger); line-height: 1.7; }

        .choice-option { display: flex; align-items: center; gap: 18px; padding: 22px 24px; border: 1px solid rgba(197,184,163,0.1); background: rgba(15,8,6,0.25); margin-bottom: 10px; cursor: pointer; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); position: relative; overflow: hidden; border-radius: 2px; }
        .choice-option::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(180deg,var(--rose),var(--bordeaux)); transition: width 0.3s ease; }
        .choice-option:hover { border-color: rgba(222,130,132,0.3); background: rgba(222,130,132,0.04); transform: translateX(3px); }
        .choice-option:has(input:checked) { border-color: rgba(222,130,132,0.45); background: rgba(222,130,132,0.07); }
        .choice-option:has(input:checked)::before { width: 3px; }
        .choice-option input[type="radio"] { width: 22px; height: 22px; accent-color: var(--rose); flex-shrink: 0; cursor: pointer; }
        .choice-text { font-size: 1.08rem; color: var(--creme); line-height: 1.55; }

        .messages { margin-bottom: 28px; }
        .message { padding: 18px 22px; border-left: 2px solid var(--sable); background: rgba(237,221,170,0.06); color: var(--sable); font-size: 1rem; margin-bottom: 10px; border-radius: 0 2px 2px 0; }
        .message.warning { border-color: var(--rose); background: rgba(222,130,132,0.06); color: var(--rose); }
        .field-errors { font-size: 0.92rem; color: #e87070; margin-top: 8px; }

        .sep { height: 1px; background: linear-gradient(90deg,transparent,rgba(197,184,163,0.2),transparent); margin: 36px 0; }
        .ornement { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
        .ornement-line { flex: 1; height: 1px; background: linear-gradient(90deg,transparent,rgba(197,184,163,0.3)); }
        .ornement-line.right { background: linear-gradient(90deg,rgba(197,184,163,0.3),transparent); }
        .ornement-diamond { width: 7px; height: 7px; background: var(--rose); transform: rotate(45deg); flex-shrink: 0; opacity: 0.8; }

        .text-sable { color: var(--sable); } .text-rose { color: var(--rose); } .text-beige { color: var(--beige); } .text-muted { color: var(--brun-leger); }
        .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; } .mt-8 { margin-top: 32px; }
        .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }

        @keyframes fadeDown { from { opacity:0; transform:translateY(-24px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeUp   { from { opacity:0; transform:translateY(36px);  } to { opacity:1; transform:translateY(0); } }
        @keyframes pulse    { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.55; transform:scale(0.95); } }
        @keyframes floatSlow { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
        @keyframes shimmer  { 0% { background-position:-200% center; } 100% { background-position:200% center; } }

        @media (max-width: 640px) {
            .page-wrapper { padding: 24px 14px 52px; }
            .container { max-width: 100%; }
            .card { padding: 30px 22px; }
            .site-header { margin-bottom: 32px; }
            .site-logo img { height: 180px; }
            h1 { font-size: clamp(2.25rem, 10vw, 3.1rem); }
            h2 { font-size: 1.8rem; }
            p { font-size: 1.08rem; line-height: 1.9; }
            .btn { width: 100%; justify-content: center; padding: 18px 22px; font-size: 0.9rem; letter-spacing: 0.16em; }
            .form-control { font-size: 1.1rem; padding: 18px 20px; }
            .choice-option { padding: 22px 20px; }
            .choice-text { font-size: 1.08rem; line-height: 1.65; }
        }
    </style>
    {% block extra_head %}{% endblock %}

    <style>
        /* =========================================================
           Direction cliente : premium, lumineux et très lisible
           - fond plus clair et doux
           - contraste renforcé
           - paragraphes sans serif lisibles
           - titres élégants conservés
           - cartes et CTA plus visibles
           - hiérarchie mobile améliorée
        ========================================================= */
        :root {
            --beige:      #7A6759;
            --sable:      #B88757;
            --rose:       #A85F68;
            --bordeaux:   #5A0E28;
            --creme:      #FFF8EF;
            --blanc-doux: #FFFFFF;
            --brun-doux:  #342629;
            --brun-leger: #6F5C52;
            --fond:       #FBF3EA;
            --fond-card:  rgba(255, 252, 246, 0.94);
        }

        body {
            font-family: 'Jost', Arial, Helvetica, sans-serif;
            font-weight: 400;
            background:
                linear-gradient(135deg, rgba(255,250,244,0.96), rgba(246,232,219,0.94)),
                radial-gradient(circle at 12% 8%, rgba(184,135,87,0.13), transparent 32%),
                radial-gradient(circle at 90% 92%, rgba(90,14,40,0.08), transparent 34%);
            color: var(--brun-doux);
        }
        body::before {
            background:
                radial-gradient(ellipse 75% 60% at 8% 0%, rgba(184,135,87,0.16) 0%, transparent 58%),
                radial-gradient(ellipse 55% 80% at 100% 92%, rgba(168,95,104,0.10) 0%, transparent 60%);
            opacity: 1;
        }
        body::after { opacity: 0.12; }

        .page-wrapper { padding-top: 34px; }
        .site-header {
            max-width: 920px;
            margin-bottom: 38px;
            padding-bottom: 28px;
            border-bottom-color: rgba(90,14,40,0.10);
        }
        .site-logo img { height: 190px; }
        .site-tagline {
            color: var(--brun-doux);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.34em;
        }
        .logo-ornement-line,
        .logo-ornement-line.right { background: linear-gradient(90deg, transparent, rgba(184,135,87,0.55), transparent); }
        .logo-ornement-dot { background: var(--sable); opacity: 1; }

        .container { max-width: 860px; }
        .card {
            background: var(--fond-card);
            border: 1px solid rgba(90,14,40,0.10);
            border-radius: 18px;
            padding: 58px 64px;
            box-shadow: 0 24px 70px rgba(63, 42, 34, 0.11);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .card::before { opacity: 0.65; background: linear-gradient(90deg, transparent, rgba(168,95,104,0.55), rgba(184,135,87,0.55), transparent); }

        h1, h2, h3,
        .question-title,
        .result-main-title,
        .result-cta-title,
        .feature-title,
        .result-phrase {
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: var(--bordeaux);
        }
        h1 { font-size: clamp(2.7rem, 6vw, 4.2rem); font-weight: 500; letter-spacing: 0.01em; }
        h1 em, h2, .text-sable { color: var(--sable); }
        h3 { color: var(--bordeaux); }
        p, .hero-desc, .question-text, .result-desc, .result-info-text, .consent-text, .feature-desc, .result-cta-sub, .nb-box p {
            font-family: 'Jost', Arial, Helvetica, sans-serif;
            color: var(--brun-doux);
            font-size: 1.16rem;
            line-height: 1.85;
            font-weight: 400;
        }
        .text-muted,
        .form-label,
        .step-indicator,
        .progress-info,
        .result-eyebrow,
        .portes-preview-title,
        .porte-dot-label,
        .submit-note,
        .fiche-row-label,
        .scoring-title { color: var(--brun-leger); }

        .btn {
            border-radius: 10px;
            min-height: 58px;
            font-weight: 600;
            letter-spacing: 0.18em;
            font-size: 0.92rem;
        }
        .btn-primary, .btn-rose {
            background: linear-gradient(135deg, #5A0E28 0%, #7B1733 52%, #9C334B 100%);
            color: #FFFDF9;
            box-shadow: 0 12px 32px rgba(90,14,40,0.25);
        }
        .btn-primary:hover, .btn-rose:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 42px rgba(90,14,40,0.32);
        }
        .btn-outline, .btn-ghost {
            background: #FFFDF9;
            color: var(--bordeaux);
            border-color: rgba(90,14,40,0.22);
        }

        .form-label {
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.22em;
        }
        .form-control {
            background: #FFFDF9;
            border: 1px solid rgba(90,14,40,0.20);
            color: var(--brun-doux);
            border-radius: 10px;
            font-size: 1.2rem;
            padding: 19px 22px;
            font-weight: 400;
        }
        .form-control:focus { border-color: rgba(90,14,40,0.48); box-shadow: 0 0 0 4px rgba(90,14,40,0.08); }
        .form-control::placeholder { color: rgba(52,38,41,0.46); }

        .consent-label,
        .choice-option,
        .result-info-box,
        .fiche-perso,
        .nb-box,
        .feature,
        .confidence-row {
            background: rgba(255,253,249,0.92);
            border: 1px solid rgba(90,14,40,0.11);
            border-radius: 14px;
            box-shadow: 0 12px 34px rgba(63, 42, 34, 0.06);
        }
        .confidence-row { justify-content: center; }
        .confidence-item { color: var(--brun-doux); font-size: 0.84rem; font-weight: 600; }
        .confidence-dot, .step-dot.active { background: var(--bordeaux); box-shadow: 0 0 0 5px rgba(90,14,40,0.08); }

        .choice-option {
            gap: 18px;
            padding: 24px 26px;
            margin-bottom: 12px;
        }
        .choice-option:hover { background: #FFFFFF; border-color: rgba(90,14,40,0.24); transform: translateX(2px); }
        .choice-option:has(input:checked) { background: #FFF7F4; border-color: rgba(90,14,40,0.42); box-shadow: 0 14px 36px rgba(90,14,40,0.10); }
        .choice-option::before { background: linear-gradient(180deg, var(--bordeaux), var(--sable)); }
        .choice-option input[type="radio"] { width: 24px; height: 24px; accent-color: var(--bordeaux); }
        .choice-text { color: var(--brun-doux); font-size: 1.16rem; line-height: 1.65; font-weight: 500; }

        .sep { background: linear-gradient(90deg, transparent, rgba(90,14,40,0.18), transparent); }
        .message { background: #FFF7E5; color: var(--brun-doux); border-left-color: var(--sable); }
        .message.warning, .field-errors { color: #A2273D; }

        .hero { padding-top: 8px; }
        .hero-eyebrow, .result-eyebrow, .question-num, .result-info-label, .fiche-perso-title {
            color: var(--bordeaux);
            font-weight: 600;
        }
        .hero h1 { font-size: clamp(3.1rem, 8vw, 5rem); }
        .hero-desc { max-width: 680px; }
        .hero-citation { color: var(--brun-leger); border-top-color: rgba(90,14,40,0.10); }
        .features {
            background: rgba(90,14,40,0.10);
            border-color: rgba(90,14,40,0.10);
            border-radius: 18px;
            box-shadow: 0 18px 54px rgba(63,42,34,0.08);
        }
        .feature { backdrop-filter: none; }
        .feature-title { color: var(--bordeaux); font-size: 1.22rem; font-weight: 600; }
        .porte-dot { opacity: 1; }
        .porte-dot-circle { background: #FFFDF9; border-color: rgba(90,14,40,0.15); box-shadow: 0 10px 26px rgba(63,42,34,0.07); }

        .progress-bar { height: 5px; background: rgba(90,14,40,0.10); border-radius: 999px; }
        .progress-fill { background: linear-gradient(90deg, var(--bordeaux), var(--sable)); border-radius: 999px; }
        .progress-fill::after { background: var(--bordeaux); top: -3px; width: 11px; height: 11px; }
        .question-block { border-bottom-color: rgba(90,14,40,0.10); }
        .question-title { font-size: clamp(1.85rem, 4.5vw, 2.35rem); font-weight: 500; }
        .question-text { color: var(--brun-leger); font-size: 1.2rem; font-style: normal; }

        .porte-illustration img { border-color: rgba(90,14,40,0.12); box-shadow: 0 18px 52px rgba(63,42,34,0.12); }
        .porte-illustration::after { background: linear-gradient(transparent, rgba(251,243,234,0.96)); }
        .result-badge { background: #FFFDF9; border-color: rgba(90,14,40,0.16); border-radius: 999px; }
        .result-badge-text { color: var(--bordeaux); font-weight: 600; }
        .result-subtitle, .result-phrase { color: var(--sable); }
        .result-desc { color: var(--brun-doux); font-size: 1.18rem; }
        .result-info-label, .fiche-perso-title { font-size: 0.75rem; }
        .result-info-text, .fiche-row-value { color: var(--brun-doux); }
        .score-track { background: rgba(90,14,40,0.10); height: 6px; }
        .score-row-label { color: var(--brun-doux); font-weight: 500; }
        .score-row-value { color: var(--bordeaux); }
        .nb-box { border-left-color: var(--sable); }

        @media (max-width: 640px) {
            .page-wrapper { padding: 18px 12px 44px; }
            .site-header { margin-bottom: 24px; padding-bottom: 20px; }
            .site-logo img { height: 128px; }
            .site-tagline { font-size: 0.66rem; letter-spacing: 0.22em; line-height: 1.8; padding: 0 8px; }
            .container { width: 100%; }
            .card { padding: 32px 22px; border-radius: 18px; }
            h1 { font-size: clamp(2.45rem, 11vw, 3.35rem); line-height: 1.05; }
            .hero h1 { font-size: clamp(2.8rem, 13vw, 4rem); }
            h2 { font-size: 2rem; }
            p, .hero-desc, .question-text, .result-desc, .result-info-text, .consent-text, .feature-desc, .result-cta-sub {
                font-size: 1.1rem;
                line-height: 1.78;
            }
            .step-indicator { font-size: 0.76rem; letter-spacing: 0.12em; line-height: 1.6; flex-wrap: wrap; }
            .hero-eyebrow, .result-eyebrow { font-size: 0.74rem; letter-spacing: 0.22em; }
            .form-label { font-size: 0.84rem; letter-spacing: 0.18em; }
            .form-control { font-size: 1.13rem; padding: 18px 18px; }
            .btn { width: 100%; justify-content: center; min-height: 62px; font-size: 0.88rem; letter-spacing: 0.13em; padding: 18px 18px; }
            .choice-option { padding: 22px 18px; align-items: flex-start; }
            .choice-text { font-size: 1.1rem; line-height: 1.65; }
            .features, .result-info-grid { grid-template-columns: 1fr !important; }
            .confidence-row { display: grid; grid-template-columns: 1fr; gap: 12px; }
            .fiche-row { align-items:flex-start; gap:8px; flex-direction:column; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header class="site-header">
            <a href="{% url 'home' %}" class="site-logo">
                <picture>
                    <source srcset="{% static 'quiz/img/logo.webp' %}" type="image/webp">
                    <img src="{% static 'quiz/img/logo.png' %}" alt="Intimement Nous">
                </picture>
            </a>
            <span class="site-tagline">Découvrez votre porte d'entrée dans l'intimité</span>
            <div class="logo-ornement">
                <div class="logo-ornement-line"></div>
                <div class="logo-ornement-dot"></div>
                <div class="logo-ornement-line right"></div>
            </div>
        </header>
        <div class="container">
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
